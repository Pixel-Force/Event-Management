<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60" fill="none">
  <!-- Celebratory Sparkle / Star Icon Mark -->
  <g transform="translate(10, 8)">
    <defs>
      <linearGradient id="logoGradWhite" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ff3d55" />
        <stop offset="100%" stop-color="#fa7c41" />
      </linearGradient>
      <linearGradient id="goldGradWhite" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f59e0b" />
        <stop offset="100%" stop-color="#fbbf24" />
      </linearGradient>
    </defs>
    <!-- Background festive emblem circle with subtle ring -->
    <circle cx="22" cy="22" r="21" fill="url(#logoGradWhite)" />
    <!-- Celebratory crown / star emblem -->
    <path d="M22 9 L25 18 L34 18 L27 23 L29 32 L22 27 L15 32 L17 23 L10 18 L19 18 Z" fill="#ffffff" />
    <!-- Little sparkles -->
    <circle cx="8" cy="10" r="2" fill="url(#goldGradWhite)" />
    <circle cx="37" cy="33" r="2.5" fill="url(#goldGradWhite)" />
    <circle cx="35" cy="8" r="1.5" fill="#ffffff" />
  </g>
  
  <!-- Brand Text: EVENT MANAGEMENT in White & Coral -->
  <text x="65" y="31" font-family="'Open Sans', 'Roboto', 'Montserrat', sans-serif" font-weight="900" font-size="22" letter-spacing="1.5" fill="#ffffff">EVENT</text>
  <text x="148" y="31" font-family="'Open Sans', 'Roboto', 'Montserrat', sans-serif" font-weight="900" font-size="22" letter-spacing="1.5" fill="#ff3d55">MANAGEMENT</text>
  <text x="66" y="47" font-family="'Open Sans', 'Roboto', sans-serif" font-weight="600" font-size="9" letter-spacing="3" fill="#abb8c3">PREMIER CELEBRATIONS &amp; EXPERIENCES</text>
</svg>
